[project]
name = "client"
version = "0.1.0"
description = "Realtime Qt client for SDXL streaming diffusion servers"
readme = "README.md"
requires-python = ">=3.10"
# Lean by design: the client is a dumb AV terminal (camera + mic in, ZMQ
# frames out to a Qt window). No torch, no CUDA — the server renders.
# Heavy optional stacks live in extras below.
dependencies = [
    "aiohttp>=3.11.15",          # legacy V1 client (GLITCHBOX_REALTIME_V2=0)
    "opencv-python>=4.11.0.86",
    "pyaudio>=0.2.14",           # legacy FFT path + device listing
    "pygame>=2.6.1",             # legacy FFT visualizer chain
    "pyside6==6.6.1",
    "python-dotenv>=1.1.0",
    "pyzmq>=26.4.0",
    "requests>=2.32.3",
    "scipy==1.15.1",             # V2 audio_thread + legacy FFT
    "sounddevice>=0.5.1",
    "uvloop>=0.21.0",
    "websockets==14.2",
]

[project.optional-dependencies]
# Speech-to-text (threads/stt_thread.py imports RealtimeSTT lazily, so the
# base install never touches this stack). Requires an NVIDIA GPU + driver.
#   uv sync --extra stt
#   GLITCHBOX_STT_ENABLED=1 ./start_client.sh
stt = [
    "realtimestt==0.3.98",
    "ctranslate2>=4.5.0",
    "nvidia-cudnn-cu12>=9.1.0",
    "torch==2.7.0",
    "torchaudio==2.7.0",
]
# Standalone RealSense depth-camera tools under utils/depthcam/.
depthcam = [
    "pyrealsense2>=2.56.5.9235",
    "pyvirtualcam>=0.14.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["clients*", "components*", "modules*", "threads*", "transport*", "utils*"]

[tool.uv]
# av 14.x is source-only on PyPI and requires FFmpeg 7 to build. Ubuntu 24.04
# ships FFmpeg 6.1, so pin av to 13.1.0, which publishes a manylinux wheel with
# bundled FFmpeg (faster-whisper only requires av>=11). Avoids any system FFmpeg
# dep. Only relevant when the stt extra is installed.
constraint-dependencies = ["av==13.1.0"]

# torch wheels for the stt extra come from the cu128 index.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
